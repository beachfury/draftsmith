plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.12'
    id 'java'
    id 'maven-publish'
}

// Jar name carries the Minecraft target, e.g. draftsmith-0.1.0+26.1.2.jar (Fabric convention).
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // For sgui (server-side chest GUIs).
    maven { url = 'https://maven.nucleoid.xyz' }
}

dependencies {
    // 1.21.1 is OBFUSCATED (unlike 26.x): era-appropriate Loom + the mojmap mappings line +
    // modImplementation (intermediary-mapped deps). The shipped jar is the remapped one.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Server-side inventory GUIs (renders on vanilla + Bedrock-via-Geyser). Must also be present at
    // runtime — sgui-1.6.1+1.21.1.jar goes in the server's mods folder alongside this mod.
    modImplementation "eu.pb4:sgui:1.6.1+1.21.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// publishToMavenLocal — how FabricPlots picks this jar up for its Jar-in-Jar bundle.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
