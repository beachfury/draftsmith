plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'java'
    id 'maven-publish'
}

// Jar name carries the Minecraft target, e.g. draftsmith-1.0.1+26.1.2.jar (Fabric convention).
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // For sgui (server-side chest GUIs).
    maven { url = 'https://maven.nucleoid.xyz' }
    // For fabric-permissions-api (soft dependency — permission nodes when LuckPerms etc. is present).
    mavenCentral()
}

dependencies {
    // Minecraft 26.x is shipped unobfuscated with official Mojang names —
    // NO 'mappings' line; Loom 1.17 handles it.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Server-side inventory GUIs (renders on vanilla + Bedrock-via-Geyser). Must also be present at
    // runtime — sgui-2.0.0+26.1.jar goes in the server's mods folder alongside this mod.
implementation "eu.pb4:sgui:${project.sgui_version}"

    // Permission nodes (draftsmith.use/wand/edit/shapes/brush/measure/admin) — the check API
    // LuckPerms and friends implement. compileOnly: NOT bundled, NOT required; without it the
    // ops + editors-list gate decides everything (PermBridge guards the classload).
    compileOnly "me.lucko:fabric-permissions-api:0.7.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// publishToMavenLocal — how FabricPlots picks this jar up for its Jar-in-Jar bundle.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
